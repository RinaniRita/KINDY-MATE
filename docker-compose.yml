services:
  db:
    image: postgres:16-alpine
    container_name: kindy_mate_db
    environment:
      POSTGRES_DB: kindy_mate_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecurepassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kindy_mate_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kindy_mate_backend
    working_dir: /app/backend
    command: >
      sh -c "uv run manage.py migrate &&
             uv run manage.py seed_demo &&
             uv run manage.py seed_curated_content &&
             uv run manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_API_URL: http://host.docker.internal:11434/api/chat
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    stop_signal: SIGINT
    stop_grace_period: 10s
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kindy_mate_frontend
    working_dir: /app/frontend
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_ENV: development
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    init: true
    stop_signal: SIGINT
    stop_grace_period: 10s
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/package.json:/app/frontend/package.json
      - ./frontend/pnpm-lock.yaml:/app/frontend/pnpm-lock.yaml
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/next.config.ts:/app/frontend/next.config.ts
      - ./frontend/next-env.d.ts:/app/frontend/next-env.d.ts
      - ./frontend/postcss.config.mjs:/app/frontend/postcss.config.mjs
      - ./frontend/eslint.config.mjs:/app/frontend/eslint.config.mjs
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
